[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoopt"
version = "0.1.0"
description = "Adaptive exploration drillhole planner"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "torch>=2.2",
    "gpytorch>=1.11",
    "plotly>=5.20",
    "streamlit>=1.35",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
geoopt = "geoopt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geoopt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
