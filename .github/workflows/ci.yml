name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # matches the venv requirements.lock was frozen from
      - name: Install
        run: |
          python -m venv .venv
          # CPU-only torch: the default Linux wheel pulls several GB of CUDA libraries.
          .venv/bin/pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install --no-deps -e .
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test
        run: .venv/bin/pytest -q
