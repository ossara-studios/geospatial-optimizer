seed: 42
log_level: INFO

# Paths are relative to this file's directory.
limits_file: limits.yaml
nodes_file: opcua_nodes.yaml
env_file: env_factors.yaml

data:
  raw_dir: ../data/raw
  processed_dir: ../data/processed
  # Hillside Cu-Au (Rex Minerals), built from SARIG by scripts/build_hillside.py
  # (see scripts/fetch_data.md and docs/data_schema.md).
  collars:
    file: hillside/collars.csv
    columns: {hole_id: hole_id, x: x, y: y, z: z, total_depth: total_depth,
              azimuth: azimuth, dip: dip, drill_date: drill_date}
  surveys:
    file: hillside/surveys.csv
    columns: {hole_id: hole_id, depth: depth, azimuth: azimuth, dip: dip}
  assays:
    file: hillside/assays.csv
    columns: {hole_id: hole_id, from_m: from_m, to_m: to_m, cu: cu}
  depth_unit: m                  # SARIG depths are metres; collars GDA2020 MGA zone 53
  cu_unit: pct                   # build script converts SARIG ppm to %
  dip_convention: negative_down  # SARIG INCLINATION: -60 = 60 deg below horizontal
  below_detection_factor: 0.5
  origin: [762500.0, 6172600.0, 0.0]   # SW corner of the Hillside deposit area (MGA53)

loop:
  runs_dir: ../runs
  max_holes: 20
  max_metres: null      # stop early once this many metres are drilled
  eval_grid: [40, 64, 16]  # x, y, z cells over the candidate extent (viz only)
  live_lab_dir: ../runs/live_lab   # OPC UA mode: rig-sim writes, planner reads

rig:
  metres_per_second: 60.0   # DEMO speed so a hole "drills" in seconds
  telemetry_period_s: 0.5

composite:
  length_m: 10.0
  min_coverage: 0.5

split:
  n_seed: 60
  method: earliest   # Hillside has a drill date on every hole: seed = first holes drilled

model:
  log_eps: 0.001      # % Cu added before log (below-detection values stay finite)
  cutoff_pct: 0.2     # PLACEHOLDER: team to set from the deposit's resource report
  max_train: 6000     # exact-GP cap; older points are subsampled beyond this
  fit_iters: 150
  lr: 0.05
  refit_every: 10     # re-tune hyperparameters every k conditioning steps
  cv_folds: 5
  device: auto        # auto = NVIDIA GPU (CUDA) when torch sees one, else CPU; or cpu | cuda
  dtype: auto         # auto = float32 on GPU, float64 on CPU; or float32 | float64

planner:
  beta: 0.5             # exploration weight (unit-free when standardize is true)
  gamma: 0.0            # boundary-uncertainty weight (0 = off)
  delta: 0.0            # targeted variance-reduction weight (0 = off)
  ore_weight: 1.0
  standardize: true
  min_spacing_m: 25.0   # soft penalty for collars closer than this to drilled holes
  spacing_weight: 1.0
  grid_spacing_m: 100.0

backtest:
  out_dir: ../runs/backtest
  strategies: [adaptive, grid, historical, random]
  random_seeds: [1, 2, 3, 4, 5]
  seed_sets:
    - {name: earliest60, method: earliest, n_seed: 60}
    - {name: spread60-a, method: spread, n_seed: 60, seed: 1}
    - {name: spread60-b, method: spread, n_seed: 60, seed: 2}
  # Same metres for every strategy. 60,000 m is ~30 % of Rex's 2010-2012 resource drilling;
  # results are reported at each report_at_m checkpoint.
  metre_budget: 60000.0
  report_at_m: [3750.0, 7500.0, 15000.0, 30000.0, 60000.0]
  discovery_at_m: 15000.0   # discovery-equivalent savings, comparable with earlier results
  max_holes: 500
  ore_threshold: 0.5
  f1_target: 0.6
  near_radius_m: 50.0   # near-data delineation zone; fixed before seeing its results
  # Block-model delineation vs a reference GP fitted on every hole, grade-above-cutoff rule.
  # All fixed before seeing any block results.
  block_size_m: [25.0, 25.0, 10.0]
  block_radius_m: 50.0      # blocks within this of any assayed composite
  block_every_m: 1250.0     # divides every report_at_m checkpoint
  reference_max_train: 6000
  block_f1_targets: [0.7, 0.8, 0.9]
  boundary_sweep:       # fixed before seeing its results
    - {beta: 0.5, gamma: 1.0}
    - {beta: 0.5, gamma: 2.0}
    - {beta: 1.0, gamma: 1.0}
  beta_sweep: [1.0, 2.0, 4.0]  # fixed before seeing sweep results; planner.beta is the base
  delineation_sweep:    # targeted variance reduction (delta); fixed before seeing its results
    - {beta: 0.5, delta: 1.0}
    - {beta: 0.5, delta: 2.0}
    - {beta: 1.0, delta: 1.0}
    - {beta: 0.0, delta: 1.0, ore_weight: 0.0}   # pure delineation

opcua:
  # Emulator default. For real EAE, change only this URL (and node ids in opcua_nodes.yaml).
  endpoint: opc.tcp://127.0.0.1:4840/geoopt/
  # Local dev uses no security. Production would use signed/encrypted OPC UA across the IT/OT firewall.
  security: none
  poll_interval_s: 0.2
  log_wait_every_s: 10.0
  timeouts:
    connect_s: 10.0
    check_s: 15.0
    # null = wait for the operator indefinitely (logging while waiting).
    approval_s: null
    drill_s: null
