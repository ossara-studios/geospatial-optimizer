# Node map: the shared contract with the EAE project (see docs/eae_contract.md).
# Each node has either `id` (string identifier inside `namespace_uri`) or a full `node_id`
# (e.g. "ns=2;s=GeoOpt.Rec.ReqId") once the EAE project exposes real ones.
# Writer: P = planner, E = EAE (emulator), R = rig simulator.
namespace_uri: urn:ossara:geoopt

nodes:
  # Recommendation (P). Rec.ReqId is the trigger: written last, on its own.
  Rec.ReqId:         {id: Rec.ReqId,         type: UInt32}
  Rec.HoleIdx:       {id: Rec.HoleIdx,       type: UInt32}
  Rec.CollarX:       {id: Rec.CollarX,       type: Double}
  Rec.CollarY:       {id: Rec.CollarY,       type: Double}
  Rec.CollarZ:       {id: Rec.CollarZ,       type: Double}
  Rec.Azimuth:       {id: Rec.Azimuth,       type: Double}
  Rec.Dip:           {id: Rec.Dip,           type: Double}
  Rec.Depth:         {id: Rec.Depth,         type: Double}
  Rec.ProbOre:       {id: Rec.ProbOre,       type: Double}
  Rec.ExpOreM:       {id: Rec.ExpOreM,       type: Double}
  Rec.Score:         {id: Rec.Score,         type: Double}
  # Limit check (E)
  Chk.ReqId:         {id: Chk.ReqId,         type: UInt32}
  Chk.Status:        {id: Chk.Status,        type: Int16}
  Chk.Reason:        {id: Chk.Reason,        type: Int16}
  Chk.Depth:         {id: Chk.Depth,         type: Double}
  # Operator approval on the HMI (E)
  Appr.ReqId:        {id: Appr.ReqId,        type: UInt32}
  Appr.Decision:     {id: Appr.Decision,     type: Int16}
  # Dispatch to the rig (E), only after approval
  Disp.ReqId:        {id: Disp.ReqId,        type: UInt32}
  Disp.HoleIdx:      {id: Disp.HoleIdx,      type: UInt32}
  Disp.Depth:        {id: Disp.Depth,        type: Double}
  # Rig status (R). Telemetry is SYNTHETIC.
  Rig.State:         {id: Rig.State,         type: Int16}
  Rig.ReqId:         {id: Rig.ReqId,         type: UInt32}
  Rig.DepthDrilled:  {id: Rig.DepthDrilled,  type: Double}
  Rig.Torque:        {id: Rig.Torque,        type: Double}
  Rig.WaterLpm:      {id: Rig.WaterLpm,      type: Double}
  Rig.PowerKw:       {id: Rig.PowerKw,       type: Double}
  # Completion forwarded to the planner side (E)
  Done.ReqId:        {id: Done.ReqId,        type: UInt32}
  Done.MetresDrilled: {id: Done.MetresDrilled, type: Double}
